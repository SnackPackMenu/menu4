<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snack Pack Flights</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; min-height:100%; }
    body {
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(0,255,255,.16), transparent 38%),
        radial-gradient(circle at bottom, rgba(255,0,247,.12), transparent 42%),
        #000;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:22px;
      overflow:hidden;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      background:linear-gradient(110deg, transparent 20%, rgba(0,255,255,.10) 45%, transparent 70%);
      background-size:220% 100%;
      animation:shimmer 8s linear infinite;
      pointer-events:none;
    }
    @keyframes shimmer {
      from { background-position:200% 0; }
      to { background-position:-200% 0; }
    }
    @keyframes floatGlow {
      0%,100% {
        transform:translateY(0);
        box-shadow:0 0 18px rgba(0,255,255,.85),0 0 38px rgba(255,0,247,.28);
      }
      50% {
        transform:translateY(-6px);
        box-shadow:0 0 28px rgba(0,255,255,1),0 0 52px rgba(255,0,247,.42);
      }
    }
    .card {
      position:relative;
      z-index:1;
      width:min(760px,94vw);
      padding:46px 24px;
      text-align:center;
      background:rgba(5,5,5,.94);
      border:2px solid #00ffff;
      border-radius:20px;
      animation:floatGlow 3.5s ease-in-out infinite;
    }
    .eyebrow {
      color:#ff69d2;
      font-weight:900;
      letter-spacing:2px;
      font-size:16px;
      text-transform:uppercase;
      margin-bottom:12px;
      text-shadow:0 0 8px #ff00f7;
    }
    h1 {
      margin:0;
      color:#00ffff;
      font-size:clamp(38px,8vw,72px);
      line-height:1;
      font-weight:1000;
      text-shadow:0 0 8px #00ffff,0 0 18px #00ffff;
    }
    p {
      margin:18px 0 30px;
      color:#fff;
      font-size:clamp(21px,4vw,30px);
      font-weight:800;
    }
    .signal-button {
      display:inline-block;
      width:min(360px,90%);
      padding:18px 24px;
      border-radius:999px;
      background:#39ff14;
      color:#000;
      text-decoration:none;
      font-size:clamp(20px,4vw,26px);
      font-weight:1000;
      box-shadow:0 0 14px #39ff14,0 0 30px rgba(57,255,20,.65);
      transition:transform .2s ease, filter .2s ease;
    }
    .signal-button:hover {
      transform:scale(1.04);
      filter:brightness(1.08);
    }
    .signal-button:active { transform:scale(.98); }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SNACK PACK FLIGHTS</div>
    <h1>PLEASE CHECK SIGNAL</h1>
    <p>For the current menu</p>
    <a class="signal-button"
       href="https://signal.group/#CjQKILBy5mEGES6ojfmcDneGcavO4pe-jWL8aWbBGIMu0olAEhDIPYOhVKTzQP-b61bWdS_1"
       target="_blank"
       rel="noopener noreferrer">OPEN SIGNAL</a>
  </main>
</body>
</html>
